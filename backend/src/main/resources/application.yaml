server:
  port: ${PORT:8080}

spring:
  application:
    name: backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  api:
    key: ${GOOGLE_BOOKS_API_KEY}
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
